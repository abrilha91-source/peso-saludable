<!doctype html><html lang="es-MX"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>PESO SALUDABLE</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'Noto Sans';src:url(fonts/NotoSans-Regular.ttf);font-weight:400}
@font-face{font-family:'Noto Sans';src:url(fonts/NotoSans-Bold.ttf);font-weight:700}
:root{--p:#0f766e;--pl:#ccfbf1;--bg:#f6f7f5;--c:#fff;--t:#1f2937;--m:#6b7280}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--t);font-size:16px;padding-bottom:84px}
header{background:var(--p);color:#fff;padding:14px 16px calc(14px);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:13px;opacity:.9}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:10px 0 4px}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 4px;border-bottom:1px solid #eee;cursor:pointer;user-select:none}
.chk:last-child{border:0}.box{width:30px;height:30px;border-radius:9px;border:2px solid var(--p);display:grid;place-items:center;flex:none;font-weight:700;color:#fff}
.chk.on .box{background:var(--p)}.chk.on span.l{color:var(--m);text-decoration:line-through}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;min-height:48px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn2{background:var(--pl);color:var(--p)}.sm{min-height:40px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:10px;min-height:46px;width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;overflow-x:auto;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;background:none;color:var(--m);border-radius:0;font-size:12px;flex-direction:column;gap:2px;min-width:66px;padding:8px 4px}
nav button.on{color:var(--p)}nav b{font-size:20px}
.ex img{width:100%;max-height:220px;object-fit:contain;background:#f0f0f0;border-radius:12px}
.muted{color:var(--m);font-size:13px}.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.badge{display:inline-block;background:var(--pl);color:var(--p);border-radius:20px;padding:6px 10px;margin:3px;font-size:13px}
.badge.off{background:#eee;color:#999}.bar{height:12px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.pring{width:150px;height:150px;margin:6px auto;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),#e5e7eb 0);display:grid;place-items:center}.pring>div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center}.pring b{font-size:38px;line-height:1}.pring small{font-size:12px;color:var(--m)}.supl{background:linear-gradient(180deg,#f0fdfa,#fff)}
.quote{font-style:italic;background:var(--pl);border-radius:12px;padding:12px}
details summary{cursor:pointer;font-weight:700;padding:8px 0;min-height:44px}
</style></head><body>
<header><h1>PESO SALUDABLE</h1><p id="sub">Tu plan para llegar a 50 kg con fuerza</p></header>
<main id="m"></main>
<nav id="nav"></nav>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
